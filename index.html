        <div class="mb-8" id="highlight-section">

                <span class="text-xs text-slate-500 font-medium">Boleh dileret / Klik anak panah <i data-lucide="chevron-right" class="w-3 h-3 inline"></i></span>
            </div>
            
            <div class="relative group">
                <!-- Butang Kiri -->
                <button onclick="scrollCarousel(-1)" class="absolute -left-3 top-1/2 -translate-y-1/2 z-20 bg-white p-2 rounded-full shadow-md border border-slate-100 hidden md:group-hover:flex items-center justify-center text-slate-600 hover:text-blue-600 transition">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>

                <div id="events-carousel" class="flex overflow-x-auto gap-4 pb-4 hide-scrollbar transition-all cursor-grab snap-x snap-mandatory scroll-smooth" style="scrollbar-width: none; -ms-overflow-style: none;">
                    <!-- Kad Kecerunan Acara akan dimuatkan di sini oleh JavaScript -->
                </div>

                <!-- Butang Kanan -->
                <button onclick="scrollCarousel(1)" class="absolute -right-3 top-1/2 -translate-y-1/2 z-20 bg-white p-2 rounded-full shadow-md border border-slate-100 hidden md:group-hover:flex items-center justify-center text-slate-600 hover:text-blue-600 transition">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <div id="feed-container" class="space-y-4">
            <!-- Loading State -->
            <div class="flex justify-center py-10" id="loading-spinner">
                <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            </div>
        </div>

    <!-- Modal Pengesahan Padam (Custom Confirm Box) -->
    <div id="custom-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4 transition-opacity">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl transform scale-100 transition-transform">
            <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-4">
                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
            </div>
            <h3 class="font-bold text-lg text-slate-800 mb-1" id="modal-title">Padam Hebahan?</h3>
            <p class="text-slate-500 text-sm mb-6" id="modal-message">Adakah anda pasti? Tindakan ini tidak boleh dipulihkan semula.</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl transition">Batal</button>
                <button id="modal-confirm-btn" class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-xl shadow-sm transition">Ya, Padam</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. LOGIK UI: TAB KOMPOSER ---
        let currentComposerType = 'normal';
        const postInput = document.getElementById('post-input');
        
        function switchTab(type) {
            currentComposerType = type;
            
            // Set butang aktif
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active', 'text-blue-600');
                btn.classList.add('text-slate-500');
            });
            document.getElementById(`tab-${type}`).classList.add('tab-active', 'text-blue-600');
            document.getElementById(`tab-${type}`).classList.remove('text-slate-500');

            // Set paparan borang
            document.getElementById('poll-container').classList.add('hidden');
            document.getElementById('registration-container').classList.add('hidden');
            
            if (type === 'poll') {
                document.getElementById('poll-container').classList.remove('hidden');
                postInput.placeholder = "Tanya sesuatu atau minta pendapat...";
            } else if (type === 'registration') {
                document.getElementById('registration-container').classList.remove('hidden');
                postInput.placeholder = "Tulis maklumat tambahan mengenai acara ini...";
            } else {
                postInput.placeholder = "Apa yang ingin dihebahkan?";
            }
        }

        // --- 2. LOGIK UI: FUNGSI LERET (DRAG TO SCROLL) KARUSEL ---
        const carousel = document.getElementById('events-carousel');
        let isDown = false;
        let startX;
        let scrollLeft;

        // Tambahan Fungsi Butang Anak Panah
        window.scrollCarousel = function(direction) {
            const scrollAmount = carousel.clientWidth; 
            const maxScroll = carousel.scrollWidth - carousel.clientWidth;
            
            if (direction === 1) { // Kanan
                // Jika sudah di hujung, kembali ke awal
                if (carousel.scrollLeft >= maxScroll - 10) {
                    carousel.scrollTo({ left: 0, behavior: 'smooth' }); 
                } else {
                    carousel.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                }
            } else { // Kiri
                // Jika di awal, pergi ke hujung
                if (carousel.scrollLeft <= 10) {
                    carousel.scrollTo({ left: maxScroll, behavior: 'smooth' }); 
                } else {
                    carousel.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                }
            }
        };

        carousel.addEventListener('mousedown', (e) => {
            isDown = true;
            carousel.classList.add('cursor-grabbing');
            carousel.classList.remove('cursor-grab');
            startX = e.pageX - carousel.offsetLeft;
            scrollLeft = carousel.scrollLeft;
        });
        carousel.addEventListener('mouseleave', () => {
            isDown = false;
            carousel.classList.remove('cursor-grabbing');
            carousel.classList.add('cursor-grab');
        });
        carousel.addEventListener('mouseup', () => {
            isDown = false;
            carousel.classList.remove('cursor-grabbing');
            carousel.classList.add('cursor-grab');
        });
        carousel.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - carousel.offsetLeft;
            const walk = (x - startX) * 2; // Kelajuan leretan
            carousel.scrollLeft = scrollLeft - walk;
        });

        // --- 3. MEMBINA KAD KECERUNAN (HIGHLIGHT) ---
        const eventsData = [
            { title: "Karnival Sukan Air Bekenu 2026", date: "15 Ogos 2026", organizer: "Majlis Daerah Subis", theme: { bg: "from-indigo-500 to-blue-600", shadow: "shadow-blue-200", text: "text-blue-700", light: "text-blue-100" } },
            { title: "Pertandingan E-Sukan Parlimen Sibuti", date: "2 September 2026", organizer: "Pusat Khidmat Parlimen", theme: { bg: "from-orange-500 to-red-500", shadow: "shadow-orange-200", text: "text-orange-700", light: "text-orange-100" } },
            { title: "Bengkel Usahawan Belia Sarawak", date: "10 September 2026", organizer: "Kementerian Belia dan Sukan", theme: { bg: "from-emerald-500 to-teal-600", shadow: "shadow-teal-200", text: "text-teal-700", light: "text-teal-100" } },
            { title: "Kejohanan Olahraga MSSD Subis", date: "14 Ogos 2026", organizer: "SMK Luar Bandar Miri", theme: { bg: "from-purple-500 to-fuchsia-600", shadow: "shadow-purple-200", text: "text-purple-700", light: "text-purple-100" } }
        ];

        function renderCarousel() {
            carousel.innerHTML = '';
            const total = eventsData.length;
            eventsData.forEach((ev, index) => {
                carousel.innerHTML += `
                    <div class="w-full shrink-0 snap-center bg-gradient-to-br ${ev.theme.bg} rounded-2xl p-6 text-white shadow-lg ${ev.theme.shadow} flex flex-col justify-between relative overflow-hidden group select-none">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10"></div>
                        <div>
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center gap-1 ${ev.theme.light} text-xs font-medium uppercase tracking-wider">
                                    <i data-lucide="calendar" class="w-3 h-3"></i> ${ev.date}
                                </div>
                                <div class="bg-black/20 px-2.5 py-1 rounded-full text-[10px] font-bold tracking-widest backdrop-blur-sm shadow-sm">
                                    ${index + 1} / ${total}
                                </div>
                            </div>
                            <h4 class="font-bold text-lg leading-tight mb-1">${ev.title}</h4>
                            <p class="${ev.theme.light} text-xs line-clamp-1">${ev.organizer}</p>
                        </div>
                        <button class="mt-4 w-full py-2 bg-white ${ev.theme.text} font-semibold rounded-xl text-sm shadow-sm hover:shadow transition flex items-center justify-center gap-1 z-10 relative cursor-pointer">
                            Daftar Sekarang <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            });
        }
        renderCarousel();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // =========================================================================
        // MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
        // =========================================================================
        const firebaseConfig = {
            // apiKey: "API_KEY_ANDA",
            // authDomain: "PROJEK_ANDA.firebaseapp.com",
            // databaseURL: "https://PROJEK_ANDA-default-rtdb.asia-southeast1.firebasedatabase.app",
        };

        const feedContainer = document.getElementById('feed-container');
        const loadingSpinner = document.getElementById('loading-spinner');
        const postForm = document.getElementById('post-form');
        const submitBtn = document.getElementById('submit-btn');

        const isFirebaseConfigured = Object.keys(firebaseConfig).length > 0;
        let db, postsRef;

        // --- 4. FUNGSI RENDER ANTARAMUKA HEBAHAN (POST CARDS) ---
        const tagColors = {
            'kokurikulum': 'bg-blue-100 text-blue-700', 'sukan': 'bg-red-100 text-red-700',
            'seni': 'bg-purple-100 text-purple-700', 'lain-lain': 'bg-slate-100 text-slate-700'
        };

        function createPostHTML(post) {
            const avatar = post.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${post.author_name}`;
            const tagColor = tagColors[post.tag] || 'bg-slate-100 text-slate-700';
            const tagLabel = post.tag ? post.tag.charAt(0).toUpperCase() + post.tag.slice(1) : 'Lain-lain';

            let extraContent = '';

            // Paparan Khas Jika Jenis "Poll" (Undian)
            if (post.type === 'poll' && post.poll) {
                let pollHtml = '<div class="mt-3 mb-4 space-y-2">';
                post.poll.options.forEach(opt => {
                    const pct = post.poll.totalVotes > 0 ? Math.round((opt.votes / post.poll.totalVotes) * 100) : 0;
                    pollHtml += `
                        <div class="relative bg-slate-50 rounded-lg overflow-hidden border border-slate-200">
                            <div class="absolute top-0 left-0 bottom-0 bg-blue-100 transition-all duration-1000" style="width: ${pct}%"></div>
                            <div class="relative p-3 flex justify-between items-center z-10">
                                <span class="font-medium text-slate-700 text-sm">${opt.text}</span>
                                <span class="text-xs font-bold text-slate-500">${pct}%</span>
                            </div>
                        </div>`;
                });
                pollHtml += `<div class="text-xs text-slate-500 mt-2 px-1">${post.poll.totalVotes} undian</div></div>`;
                extraContent = pollHtml;
            }

            // Paparan Khas Jika Jenis "Registration" (Pendaftaran)
            if (post.type === 'registration' && post.registration) {
                let postersHtml = '';
                
                // Menjana blok gambar jika ada salah satu poster
                if (post.registration.posterHebahan || post.registration.posterKeputusan) {
                    postersHtml = `<div class="grid ${post.registration.posterHebahan && post.registration.posterKeputusan ? 'grid-cols-2' : 'grid-cols-1'} gap-2 border-b border-slate-200 bg-slate-100 p-2">`;
                    
                    if (post.registration.posterHebahan) {
                        postersHtml += `<div class="relative"><span class="absolute top-2 left-2 bg-blue-600 text-white text-[10px] px-2.5 py-0.5 rounded shadow font-bold tracking-wider">HEBAHAN</span><img src="${post.registration.posterHebahan}" class="w-full h-40 object-cover rounded shadow-sm border border-slate-200" /></div>`;
                    }
                    if (post.registration.posterKeputusan) {
                        postersHtml += `<div class="relative"><span class="absolute top-2 left-2 bg-orange-500 text-white text-[10px] px-2.5 py-0.5 rounded shadow font-bold tracking-wider">KEPUTUSAN</span><img src="${post.registration.posterKeputusan}" class="w-full h-40 object-cover rounded shadow-sm border border-slate-200" /></div>`;
                    }
                    postersHtml += `</div>`;
                } else {
                    // Poster lalai jika tiada gambar dimuat naik
                    postersHtml = `<div class="relative w-full h-32 bg-slate-100 border-b border-slate-200 flex items-center justify-center">
                        <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800&auto=format&fit=crop" alt="Poster Lalai" class="max-h-full max-w-full object-cover opacity-40 grayscale" />
                    </div>`;
                }

                extraContent = `
                    <div class="mt-3 mb-4 rounded-xl border border-slate-200 overflow-hidden bg-slate-50">
                        ${postersHtml}
                        <div class="p-4">
                            <h4 class="font-bold text-slate-800 text-lg leading-tight mb-2">${post.registration.title}</h4>
                            <div class="flex flex-col gap-1.5 text-sm text-slate-600 font-medium mb-4">
                                <span class="flex items-center gap-2"><i data-lucide="calendar" class="w-4 h-4 text-blue-500"></i> ${post.registration.date}</span>
                                ${post.registration.organizer ? `<span class="flex items-center gap-2"><i data-lucide="users" class="w-4 h-4 text-emerald-500"></i> ${post.registration.organizer}</span>` : ''}
                            </div>
                            ${post.registration.link ? 
                                `<a href="${post.registration.link}" target="_blank" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl text-sm shadow-sm transition flex items-center justify-center gap-2">Daftar / Maklumat Lanjut <i data-lucide="external-link" class="w-4 h-4"></i></a>` 
                                : `<button class="w-full py-2.5 bg-slate-200 text-slate-500 cursor-not-allowed font-medium rounded-xl text-sm transition flex items-center justify-center gap-2">Tiada Pautan Pendaftaran</button>`
                            }
                        </div>
                    </div>`;
            }

            return `
                <div id="post-${post.id}" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-4 transition-all duration-300">
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <img src="${avatar}" class="w-10 h-10 rounded-full border border-slate-200 bg-slate-50 object-cover" />
                                <div>
                                    <h3 class="font-bold text-slate-800 text-sm">${post.author_name}</h3>
                                    <div class="flex items-center gap-2 text-xs text-slate-500">
                                        <span>${post.time}</span>
                                        <span>•</span>
                                        <span class="px-1.5 py-0.5 rounded ${tagColor}">${tagLabel}</span>
                                    </div>
                                </div>
                            </div>
                            <!-- Menu Tiga Titik -->
                            <div class="relative">
                                <button onclick="toggleMenu('${post.id}')" class="text-slate-400 hover:bg-slate-100 p-1.5 rounded-full transition"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
                                <div id="post-menu-${post.id}" class="hidden absolute right-0 mt-1 w-36 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-10">
                                    <button onclick="editPost('${post.id}')" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2"><i data-lucide="edit-3" class="w-4 h-4"></i> Edit</button>
                                    <button class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 flex items-center gap-2"><i data-lucide="share" class="w-4 h-4"></i> Kongsi</button>
                                    <button onclick="deletePost('${post.id}')" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center gap-2"><i data-lucide="trash-2" class="w-4 h-4"></i> Padam</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Paparan Teks Biasa -->
                        <div id="post-view-${post.id}">
                            <p class="text-slate-700 whitespace-pre-wrap" id="post-text-${post.id}">${post.content}</p>
                        </div>
                        
                        <!-- Paparan Mod Suntingan (Edit) -->
                        <div id="post-edit-${post.id}" class="hidden mt-2 mb-3">
                            <textarea id="edit-input-${post.id}" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition resize-none min-h-[80px]">${post.content}</textarea>
                            <div class="flex justify-end gap-2 mt-2">
                                <button onclick="cancelEdit('${post.id}')" class="px-4 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition">Batal</button>
                                <button onclick="saveEdit('${post.id}')" class="px-4 py-1.5 text-xs font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition">Simpan</button>
                            </div>
                        </div>

                        ${extraContent}
                    </div>
                    <div class="px-4 py-2 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-slate-500">
                        <button id="btn-like-${post.id}" onclick="toggleLike('${post.id}')" class="flex-1 flex items-center justify-center gap-2 py-2 hover:bg-slate-200 rounded-lg transition text-sm font-medium">
                            <i data-lucide="thumbs-up" class="w-4 h-4"></i> <span id="like-count-${post.id}">${Math.floor(Math.random() * 20) + 1}</span> Suka
                        </button>
                        <button onclick="toggleComment('${post.id}')" class="flex-1 flex items-center justify-center gap-2 py-2 hover:bg-slate-200 rounded-lg transition text-sm font-medium">
                            <i data-lucide="message-square" class="w-4 h-4"></i> Komen
                        </button>
                    </div>
                    
                    <!-- Ruangan Komen (Tersembunyi secara lalai) -->
                    <div id="comment-section-${post.id}" class="hidden bg-slate-50 border-t border-slate-100 p-4">
                        <div class="flex gap-2 mb-3">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" class="w-8 h-8 rounded-full border border-slate-300 bg-white" />
                            <div class="flex-1 flex">
                                <input type="text" id="comment-input-${post.id}" placeholder="Tulis komen anda..." class="flex-1 bg-white border border-slate-300 rounded-l-lg px-3 py-1.5 text-sm outline-none focus:border-blue-500" />
                                <button onclick="submitComment('${post.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-r-lg transition text-sm font-medium">Hantar</button>
                            </div>
                        </div>
                        <!-- Senarai Komen -->
                        <div id="comments-list-${post.id}" class="space-y-3 pl-10 text-sm">
                            <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm">
                                <span class="font-bold text-slate-700 block text-xs mb-0.5">Ahli Komuniti</span>
                                <span class="text-slate-600">Maklumat yang sangat bermanfaat, terima kasih!</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- LOGIK BUTANG INTERAKTIF (SUKA, KOMEN, MENU) ---
        window.toggleMenu = function(postId) {
            const menu = document.getElementById(`post-menu-${postId}`);
            menu.classList.toggle('hidden');
        };

        // Modal Khas Untuk Pengesahan Padam
        window.showConfirmModal = function(onConfirm) {
            document.getElementById('custom-modal').classList.remove('hidden');
            const confirmBtn = document.getElementById('modal-confirm-btn');
            
            // Buang event listener lama untuk elak padam pos yang salah
            confirmBtn.replaceWith(confirmBtn.cloneNode(true));
            const newConfirmBtn = document.getElementById('modal-confirm-btn');
            
            newConfirmBtn.addEventListener('click', function() {
                onConfirm();
                closeModal();
            });
        };

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
        };

        window.deletePost = function(postId) {
            toggleMenu(postId); // Tutup menu
            
            showConfirmModal(() => {
                const postElement = document.getElementById(`post-${postId}`);
                if(postElement) {
                    postElement.classList.add('opacity-0', 'scale-95'); // Animasi hilang
                    setTimeout(() => postElement.remove(), 300); // Padam dari UI selepas 0.3 saat
                }
            });
        };

        // Fungsi Suntingan (Edit)
        window.editPost = function(postId) {
            toggleMenu(postId); // Tutup menu
            document.getElementById(`post-view-${postId}`).classList.add('hidden');
            document.getElementById(`post-edit-${postId}`).classList.remove('hidden');
            document.getElementById(`edit-input-${postId}`).focus(); // Auto fokus kotak taip
        };

        window.cancelEdit = function(postId) {
            document.getElementById(`post-view-${postId}`).classList.remove('hidden');
            document.getElementById(`post-edit-${postId}`).classList.add('hidden');
            // Kembalikan teks asal jika batal
            document.getElementById(`edit-input-${postId}`).value = document.getElementById(`post-text-${postId}`).innerText;
        };

        window.saveEdit = function(postId) {
            const newText = document.getElementById(`edit-input-${postId}`).value.trim();
            if(!newText) return;

            // Kemas kini DOM (paparan html)
            document.getElementById(`post-text-${postId}`).innerText = newText;
            
            // Tutup mod suntingan
            document.getElementById(`post-view-${postId}`).classList.remove('hidden');
            document.getElementById(`post-edit-${postId}`).classList.add('hidden');
            
            // Update Array Mock Data supaya tak hilang bila render semula
            if(!isFirebaseConfigured && mockPosts) {
                const postIndex = mockPosts.findIndex(p => p.id == postId);
                if(postIndex > -1) mockPosts[postIndex].content = newText;
            }
        };

        window.toggleLike = function(postId) {
            const btn = document.getElementById(`btn-like-${postId}`);
            const countSpan = document.getElementById(`like-count-${postId}`);
            
            // Logik togol Suka
            if (btn.classList.contains('text-blue-600')) {
                btn.classList.remove('text-blue-600', 'bg-blue-50');
                countSpan.innerText = parseInt(countSpan.innerText) - 1;
            } else {
                btn.classList.add('text-blue-600', 'bg-blue-50');
                countSpan.innerText = parseInt(countSpan.innerText) + 1;
            }
        };

        window.toggleComment = function(postId) {
            const section = document.getElementById(`comment-section-${postId}`);
            section.classList.toggle('hidden');
        };

        window.submitComment = function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const list = document.getElementById(`comments-list-${postId}`);
            
            // Tambah komen baru ke paparan
            const newCommentHTML = `
                <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm animate-pulse">
                    <span class="font-bold text-blue-600 block text-xs mb-0.5">Anda</span>
                    <span class="text-slate-600">${text}</span>
                </div>
            `;
            
            list.insertAdjacentHTML('beforeend', newCommentHTML);
            
            // Hentikan animasi nadi selepas 1 saat
            setTimeout(() => {
                list.lastElementChild.classList.remove('animate-pulse');
            }, 1000);

            input.value = ''; // Kosongkan input
        };

        // --- 5. LOGIK FIREBASE & SIMULASI ---
        if (isFirebaseConfigured) {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            postsRef = ref(db, 'posts');

            onValue(postsRef, (snapshot) => {
                loadingSpinner.style.display = 'none';
                feedContainer.innerHTML = ''; 
                const data = snapshot.val();
                if (data) {
                    const postsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                    postsArray.forEach(post => { feedContainer.innerHTML += createPostHTML(post); });
                } else {
                    feedContainer.innerHTML = '<div class="text-center py-10 bg-white rounded-xl border border-slate-200"><p class="text-slate-500 font-medium">Belum ada hebahan.</p></div>';
                }
                lucide.createIcons();
            });
        } else {
            // Simulasi Data Mock Lengkap
            loadingSpinner.style.display = 'none';
            let mockPosts = [
                { id: 1, author_name: "Majlis Daerah Subis", content: "Terima kasih kepada semua yang sudi hadir ke acara sukan air kelolaan kami semalam. Berikut adalah keputusan rasmi yang ditunggu-tunggu!", time: "2 jam yang lalu", tag: "sukan", type: "registration", registration: { title: "Karnival Sukan Air Bekenu 2026", date: "27 Julai 2026", organizer: "Majlis Daerah Subis", link: "https://mdsubis.gov.my/sukan-air", posterHebahan: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800&auto=format&fit=crop", posterKeputusan: "https://images.unsplash.com/photo-1578269174936-2709b6aeb913?q=80&w=800&auto=format&fit=crop" }, avatar: "https://api.dicebear.com/7.x/shapes/svg?seed=subis&backgroundColor=0284c7" },
                { id: 2, author_name: "Cikgu Salmah", content: "Pilih aktiviti kegemaran anda untuk karnival hujung tahun ini. Undian tertinggi akan mendapat peruntukan lebih besar!", time: "5 jam yang lalu", tag: "kokurikulum", type: "poll", poll: { options: [{ text: "Pertandingan Memasak", votes: 45 }, { text: "Sukaneka Air", votes: 89 }, { text: "E-Sukan (Mobile)", votes: 120 }], totalVotes: 254 }, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Salmah" }
            ];
            
            function renderMockPosts() {
                feedContainer.innerHTML = '';
                mockPosts.forEach(post => { feedContainer.innerHTML += createPostHTML(post); });
                lucide.createIcons();
            }
            renderMockPosts();

            window.addMockPost = function(newPostData) {
                mockPosts.unshift({ id: Date.now(), ...newPostData });
                renderMockPosts();
            }
        }

        // --- 6. PENGHANTARAN BORANG ---
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('post-input').value.trim();
            if (!content) return;

            submitBtn.innerHTML = 'Menyimpan...';
            submitBtn.disabled = true;

            const newPostData = {
                author_name: "Pengguna Vercel",
                content: content,
                time: "Baru sahaja",
                avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Admin",
                tag: document.getElementById('post-tag').value,
                type: window.currentComposerType // dari logik global
            };

            // Tambah data spesifik mengikut jenis tab (Poll/Registration)
            if (window.currentComposerType === 'poll') {
                newPostData.poll = {
                    totalVotes: 0,
                    options: [
                        { text: document.getElementById('poll-opt-1').value || "Pilihan 1", votes: 0 },
                        { text: document.getElementById('poll-opt-2').value || "Pilihan 2", votes: 0 }
                    ]
                };
            } else if (window.currentComposerType === 'registration') {
                // Simulasi gambar placeholder jika fail dipilih
                const hebahanInput = document.getElementById('reg-poster-hebahan');
                const keputusanInput = document.getElementById('reg-poster-keputusan');
                const simHebahan = hebahanInput.files.length > 0 ? "https://images.unsplash.com/photo-1505373877841-8d25f7d46678?q=80&w=800&auto=format&fit=crop" : null;
                const simKeputusan = keputusanInput.files.length > 0 ? "https://images.unsplash.com/photo-1578269174936-2709b6aeb913?q=80&w=800&auto=format&fit=crop" : null;

                newPostData.registration = {
                    title: document.getElementById('reg-title').value || "Acara Baharu",
                    date: document.getElementById('reg-date').value || "Akan Diumumkan",
                    organizer: document.getElementById('reg-organizer').value || "",
                    link: document.getElementById('reg-link').value || "",
                    posterHebahan: simHebahan,
                    posterKeputusan: simKeputusan
                };
            }

            if (isFirebaseConfigured) {
                try {
                    await set(push(postsRef), newPostData);
                } catch (error) {
                    console.error("Ralat Firebase:", error);
                    alert("Gagal menghantar hebahan.");
                }
            } else {
                window.addMockPost(newPostData);
            }

            // Reset borang
            document.getElementById('post-input').value = '';
            document.getElementById('reg-title').value = '';
            document.getElementById('reg-date').value = '';
            document.getElementById('reg-organizer').value = '';
            document.getElementById('reg-link').value = '';
            document.getElementById('reg-poster-hebahan').value = '';
            document.getElementById('reg-poster-keputusan').value = '';
            document.getElementById('poll-opt-1').value = '';
            document.getElementById('poll-opt-2').value = '';
            window.switchTab('normal');
            
            submitBtn.innerHTML = 'Hebahkan';
            submitBtn.disabled = false;
        });

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
