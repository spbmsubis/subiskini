<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubisKini - Papan Muka</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-blue-600">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-lg leading-none">S</span>
                </div>
                <span class="text-xl font-bold tracking-tight">SubisKini</span>
            </div>
            
            <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-full py-1 pr-4 pl-1">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="Profile" class="w-8 h-8 rounded-full border border-slate-300 bg-white" />
                <span class="text-sm font-semibold text-slate-700" id="user-name-display">Pengguna Vercel</span>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto pt-6 px-4">
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="p-4">
                <form id="post-form">
                    <div class="flex gap-3 mb-4">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" class="w-10 h-10 rounded-full border border-slate-200 bg-slate-50" />
                        <textarea 
                            id="post-input"
                            placeholder="Ada program atau hebahan terkini?"
                            class="w-full bg-slate-50 rounded-xl px-4 py-3 text-slate-700 placeholder-slate-400 outline-none resize-none min-h-[100px] border border-slate-200 focus:border-blue-400 focus:bg-white transition"
                            required
                        ></textarea>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                        <div class="flex items-center gap-2 text-slate-500">
                            <i data-lucide="image" class="w-5 h-5 cursor-pointer hover:text-blue-500"></i>
                            <i data-lucide="calendar" class="w-5 h-5 cursor-pointer hover:text-blue-500"></i>
                        </div>
                        <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-full transition flex items-center gap-2 text-sm shadow-sm">
                            Hebahkan
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div id="feed-container" class="space-y-4">
            <!-- Loading State -->
            <div class="flex justify-center py-10" id="loading-spinner">
                <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            </div>
        </div>

    </main>

    <script type="module">
        // 1. IMPORT FIREBASE (Menggunakan CDN yang disokong Vercel/Browser)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // =========================================================================
        // 2. MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
        // (Dapatkan dari Firebase Console > Project Settings)
        // =========================================================================
        const firebaseConfig = {
            // apiKey: "API_KEY_ANDA",
            // authDomain: "PROJEK_ANDA.firebaseapp.com",
            // databaseURL: "https://PROJEK_ANDA-default-rtdb.asia-southeast1.firebasedatabase.app",
            // projectId: "PROJEK_ANDA",
            // storageBucket: "PROJEK_ANDA.appspot.com",
            // messagingSenderId: "SENDER_ID",
            // appId: "APP_ID"
        };

        const feedContainer = document.getElementById('feed-container');
        const loadingSpinner = document.getElementById('loading-spinner');
        const postForm = document.getElementById('post-form');
        const postInput = document.getElementById('post-input');
        const submitBtn = document.getElementById('submit-btn');

        // Semak jika konfigurasi Firebase telah diisi
        const isFirebaseConfigured = Object.keys(firebaseConfig).length > 0;

        let db;
        let postsRef;

        if (isFirebaseConfigured) {
            // Jika ada Firebase, mulakan sambungan
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            postsRef = ref(db, 'posts');

            // Baca Data (Realtime)
            onValue(postsRef, (snapshot) => {
                loadingSpinner.style.display = 'none';
                feedContainer.innerHTML = ''; 
                
                const data = snapshot.val();
                if (data) {
                    // Tukar Objek kepada Array dan terbalikkan (yang baharu di atas)
                    const postsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                    postsArray.forEach(post => {
                        feedContainer.innerHTML += createPostHTML(post);
                    });
                } else {
                    feedContainer.innerHTML = '<div class="text-center py-10 bg-white rounded-xl border border-slate-200"><p class="text-slate-500 font-medium">Belum ada hebahan pertama.</p></div>';
                }
                lucide.createIcons();
            });

        } else {
            // Jika Firebase belum diisi, guna data Mock (Simulasi)
            loadingSpinner.style.display = 'none';
            let mockPosts = [
                { id: 1, author_name: "Admin Subis", content: "Selamat datang ke SubisKini versi Vercel! Sila masukkan konfigurasi Firebase anda di dalam fail index.html untuk mula menyimpan data sebenar.", time: "Baru sahaja" }
            ];
            
            function renderMockPosts() {
                feedContainer.innerHTML = '';
                mockPosts.forEach(post => { feedContainer.innerHTML += createPostHTML(post); });
                lucide.createIcons();
            }
            renderMockPosts();

            // Fungsi tambah post untuk simulasi
            window.addMockPost = function(content) {
                mockPosts.unshift({
                    id: Date.now(),
                    author_name: "Pengguna Vercel",
                    content: content,
                    time: "Baru sahaja"
                });
                renderMockPosts();
            }
        }

        // 3. LOGIK MENGHANTAR HEBAHAN
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = postInput.value.trim();
            if (!content) return;

            submitBtn.innerHTML = 'Menyimpan...';
            submitBtn.disabled = true;

            const newPostData = {
                author_name: "Pengguna Vercel", // Akan diganti dengan data SSO Supabase nanti
                content: content,
                time: new Date().toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' }),
                avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Admin"
            };

            if (isFirebaseConfigured) {
                try {
                    const newNode = push(postsRef);
                    await set(newNode, newPostData);
                    postInput.value = '';
                } catch (error) {
                    console.error("Ralat Firebase:", error);
                    alert("Gagal menghantar hebahan. Sila semak konfigurasi (databaseURL).");
                }
            } else {
                // Gunakan simulasi
                window.addMockPost(content);
                postInput.value = '';
            }

            submitBtn.innerHTML = 'Hebahkan';
            submitBtn.disabled = false;
        });

        // 4. FUNGSI MEMBINA ANTARAMUKA KAD HEBAHAN (HTML String)
        function createPostHTML(post) {
            const avatar = post.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${post.author_name}`;
            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-4">
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <img src="${avatar}" class="w-10 h-10 rounded-full border border-slate-200 bg-slate-50 object-cover" />
                                <div>
                                    <h3 class="font-bold text-slate-800 text-sm">${post.author_name}</h3>
                                    <div class="flex items-center gap-2 text-xs text-slate-500">
                                        <span>${post.time}</span>
                                    </div>
                                </div>
                            </div>
                            <button class="text-slate-400 hover:bg-slate-100 p-1.5 rounded-full">
                                <i data-lucide="more-horizontal" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <p class="text-slate-700 whitespace-pre-wrap">${post.content}</p>
                    </div>
                    <div class="px-4 py-2 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-slate-500">
                        <button class="flex-1 flex items-center justify-center gap-2 py-2 hover:bg-slate-200 rounded-lg transition text-sm font-medium">
                            <i data-lucide="thumbs-up" class="w-4 h-4"></i> Suka
                        </button>
                        <button class="flex-1 flex items-center justify-center gap-2 py-2 hover:bg-slate-200 rounded-lg transition text-sm font-medium">
                            <i data-lucide="message-square" class="w-4 h-4"></i> Komen
                        </button>
                    </div>
                </div>
            `;
        }

        // Mulakan ikon pada permulaan
        lucide.createIcons();
    </script>
</body>
</html>
