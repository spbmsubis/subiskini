<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubisKini - Papan Muka</title>
    
    <!-- Memuatkan Tailwind CSS dan Ikon -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .tab-active { color: #2563eb; border-bottom: 2px solid #2563eb; background-color: rgba(239, 246, 255, 0.5); }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-20">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-2xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-blue-600 cursor-pointer" onclick="window.scrollTo(0,0)">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                    <span class="text-white font-bold text-lg leading-none">S</span>
                </div>
                <span class="text-xl font-bold tracking-tight">SubisKini</span>
            </div>
            
            <div class="flex items-center gap-2 bg-slate-100 rounded-full py-1 pr-4 pl-1 border border-slate-200 cursor-pointer hover:bg-slate-200 transition shadow-sm">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" alt="Profile" class="w-8 h-8 rounded-full border border-slate-300 bg-white object-cover" />
                <span class="text-sm font-semibold text-slate-700 leading-tight">Pengguna Vercel</span>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto pt-6 px-4">
        
        <div class="mb-6 relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <i data-lucide="search" class="h-5 w-5 text-slate-400"></i>
            </div>
            <input type="text" id="search-input" class="block w-full pl-10 pr-10 py-3 border border-slate-300 rounded-full leading-5 bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm shadow-sm transition" placeholder="Cari program, sekolah, atau teks hebahan...">
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
            <div class="flex border-b border-slate-100" id="composer-tabs">
                <button onclick="switchTab('normal')" id="tab-normal" class="tab-btn flex-1 py-3 text-sm font-medium transition tab-active text-slate-500 hover:bg-slate-50">Hebahan</button>
                <button onclick="switchTab('poll')" id="tab-poll" class="tab-btn flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 transition text-slate-500 hover:bg-slate-50"><i data-lucide="bar-chart-2" class="w-4 h-4"></i> Undian</button>
                <button onclick="switchTab('registration')" id="tab-registration" class="tab-btn flex-1 py-3 text-sm font-medium flex items-center justify-center gap-2 transition text-slate-500 hover:bg-slate-50"><i data-lucide="calendar" class="w-4 h-4"></i> Pendaftaran</button>
            </div>

            <div class="p-4">
                <form id="post-form">
                    <div class="flex gap-3 mb-4">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Admin" class="w-10 h-10 rounded-full border border-slate-200 bg-slate-50" />
                        <textarea id="post-input" placeholder="Apa yang ingin dihebahkan?" class="w-full bg-slate-50 rounded-xl px-4 py-3 text-slate-700 placeholder-slate-400 outline-none resize-none min-h-[100px] border border-slate-200 focus:border-blue-400 focus:bg-white transition" required></textarea>
                    </div>

                    <!-- Bekas Undian (Tersembunyi secara lalai) -->
                    <div id="poll-container" class="hidden pl-13 pr-2 space-y-2 mb-4">
                        <div class="flex gap-2">
                            <input type="text" id="poll-opt-1" placeholder="Pilihan 1" class="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" />
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="poll-opt-2" placeholder="Pilihan 2" class="flex-1 bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" />
                        </div>
                        <p class="text-xs text-slate-400 mt-1">Ciri penuh undian disokong dalam integrasi pangkalan data.</p>
                    </div>

                    <!-- Bekas Pendaftaran (Tersembunyi secara lalai) -->
                    <div id="registration-container" class="hidden pl-13 pr-2 mb-4 space-y-3 bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-1">
                            <input type="text" id="reg-title" placeholder="Tajuk Acara (cth: Sukan Tahunan)" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" />
                            <input type="text" id="reg-date" placeholder="Tarikh (cth: 12 Nov 2026)" class="bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500" />
                        </div>
                        <div class="flex items-center gap-2 mt-2">
                            <i data-lucide="link" class="w-4 h-4 text-slate-400"></i>
                            <input type="url" id="reg-link" placeholder="URL Pendaftaran (cth: Google Forms)" class="flex-1 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500 transition text-slate-700" />
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-2 border-t border-slate-100">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-medium text-slate-500">Kategori:</span>
                            <select id="post-tag" class="bg-slate-100 border-none text-xs font-medium text-slate-700 py-1.5 px-3 rounded-full outline-none cursor-pointer">
                                <option value="lain-lain">Lain-lain</option>
                                <option value="kokurikulum">Kokurikulum</option>
                                <option value="sukan">Sukan</option>
                                <option value="seni">Seni</option>
                            </select>
                        </div>
                        <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-full transition flex items-center gap-2 text-sm shadow-sm">
                            Hebahkan
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="mb-8" id="highlight-section">
            <div class="flex items-center justify-between mb-3 px-1">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">🔥 Hangat: Acara Akan Datang</h3>
                <span class="text-xs text-slate-500 font-medium">Boleh dileret <i data-lucide="chevron-right" class="w-3 h-3 inline"></i></span>
            </div>
            
            <div id="events-carousel" class="flex overflow-x-auto gap-4 pb-4 hide-scrollbar transition-all cursor-grab snap-x" style="scrollbar-width: none; -ms-overflow-style: none;">
                <!-- Kad Kecerunan Acara akan dimuatkan di sini oleh JavaScript -->
            </div>
        </div>

        <div id="feed-container" class="space-y-4">
            <!-- Loading State -->
            <div class="flex justify-center py-10" id="loading-spinner">
                <div class="w-8 h-8 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
            </div>
        </div>

    </main>

    <script>
        // --- 1. LOGIK UI: TAB KOMPOSER ---
        let currentComposerType = 'normal';
        const postInput = document.getElementById('post-input');
        
        function switchTab(type) {
            currentComposerType = type;
            
            // Set butang aktif
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active', 'text-blue-600');
                btn.classList.add('text-slate-500');
            });
            document.getElementById(`tab-${type}`).classList.add('tab-active', 'text-blue-600');
            document.getElementById(`tab-${type}`).classList.remove('text-slate-500');

            // Set paparan borang
            document.getElementById('poll-container').classList.add('hidden');
            document.getElementById('registration-container').classList.add('hidden');
            
            if (type === 'poll') {
                document.getElementById('poll-container').classList.remove('hidden');
                postInput.placeholder = "Tanya sesuatu atau minta pendapat...";
            } else if (type === 'registration') {
                document.getElementById('registration-container').classList.remove('hidden');
                postInput.placeholder = "Tulis maklumat tambahan mengenai acara ini...";
            } else {
                postInput.placeholder = "Apa yang ingin dihebahkan?";
            }
        }

        // --- 2. LOGIK UI: FUNGSI LERET (DRAG TO SCROLL) KARUSEL ---
        const carousel = document.getElementById('events-carousel');
        let isDown = false;
        let startX;
        let scrollLeft;

        carousel.addEventListener('mousedown', (e) => {
            isDown = true;
            carousel.classList.add('cursor-grabbing');
            carousel.classList.remove('cursor-grab');
            startX = e.pageX - carousel.offsetLeft;
            scrollLeft = carousel.scrollLeft;
        });
        carousel.addEventListener('mouseleave', () => {
            isDown = false;
            carousel.classList.remove('cursor-grabbing');
            carousel.classList.add('cursor-grab');
        });
        carousel.addEventListener('mouseup', () => {
            isDown = false;
            carousel.classList.remove('cursor-grabbing');
            carousel.classList.add('cursor-grab');
        });
        carousel.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - carousel.offsetLeft;
            const walk = (x - startX) * 2; // Kelajuan leretan
            carousel.scrollLeft = scrollLeft - walk;
        });

        // --- 3. MEMBINA KAD KECERUNAN (HIGHLIGHT) ---
        const eventsData = [
            { title: "Karnival Sukan Air Bekenu 2026", date: "15 Ogos 2026", organizer: "Majlis Daerah Subis", theme: { bg: "from-indigo-500 to-blue-600", shadow: "shadow-blue-200", text: "text-blue-700", light: "text-blue-100" } },
            { title: "Pertandingan E-Sukan Parlimen Sibuti", date: "2 September 2026", organizer: "Pusat Khidmat Parlimen", theme: { bg: "from-orange-500 to-red-500", shadow: "shadow-orange-200", text: "text-orange-700", light: "text-orange-100" } },
            { title: "Bengkel Usahawan Belia Sarawak", date: "10 September 2026", organizer: "Kementerian Belia dan Sukan", theme: { bg: "from-emerald-500 to-teal-600", shadow: "shadow-teal-200", text: "text-teal-700", light: "text-teal-100" } },
            { title: "Kejohanan Olahraga MSSD Subis", date: "14 Ogos 2026", organizer: "SMK Luar Bandar Miri", theme: { bg: "from-purple-500 to-fuchsia-600", shadow: "shadow-purple-200", text: "text-purple-700", light: "text-purple-100" } }
        ];

        function renderCarousel() {
            carousel.innerHTML = '';
            eventsData.forEach(ev => {
                carousel.innerHTML += `
                    <div class="min-w-[280px] max-w-[280px] snap-center bg-gradient-to-br ${ev.theme.bg} rounded-2xl p-5 text-white shadow-lg ${ev.theme.shadow} flex flex-col justify-between relative overflow-hidden group select-none">
                        <div class="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10"></div>
                        <div>
                            <div class="flex items-center gap-1 ${ev.theme.light} text-xs font-medium mb-2 uppercase tracking-wider">
                                <i data-lucide="calendar" class="w-3 h-3"></i> ${ev.date}
                            </div>
                            <h4 class="font-bold text-lg leading-tight mb-1">${ev.title}</h4>
                            <p class="${ev.theme.light} text-xs line-clamp-1">${ev.organizer}</p>
                        </div>
                        <button class="mt-4 w-full py-2 bg-white ${ev.theme.text} font-semibold rounded-xl text-sm shadow-sm hover:shadow transition flex items-center justify-center gap-1 z-10 relative cursor-pointer">
                            Daftar Sekarang <i data-lucide="chevron-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            });
        }
        renderCarousel();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // =========================================================================
        // MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI
        // =========================================================================
        const firebaseConfig = {
            // apiKey: "API_KEY_ANDA",
            // authDomain: "PROJEK_ANDA.firebaseapp.com",
            // databaseURL: "https://PROJEK_ANDA-default-rtdb.asia-southeast1.firebasedatabase.app",
        };

        const feedContainer = document.getElementById('feed-container');
        const loadingSpinner = document.getElementById('loading-spinner');
        const postForm = document.getElementById('post-form');
        const submitBtn = document.getElementById('submit-btn');

        const isFirebaseConfigured = Object.keys(firebaseConfig).length > 0;
        let db, postsRef;

        // --- 4. FUNGSI RENDER ANTARAMUKA HEBAHAN (POST CARDS) ---
        const tagColors = {
            'kokurikulum': 'bg-blue-100 text-blue-700', 'sukan': 'bg-red-100 text-red-700',
            'seni': 'bg-purple-100 text-purple-700', 'lain-lain': 'bg-slate-100 text-slate-700'
        };

        function createPostHTML(post) {
            const avatar = post.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${post.author_name}`;
            const tagColor = tagColors[post.tag] || 'bg-slate-100 text-slate-700';
            const tagLabel = post.tag ? post.tag.charAt(0).toUpperCase() + post.tag.slice(1) : 'Lain-lain';

            let extraContent = '';

            // Paparan Khas Jika Jenis "Poll" (Undian)
            if (post.type === 'poll' && post.poll) {
                let pollHtml = '<div class="mt-3 mb-4 space-y-2">';
                post.poll.options.forEach(opt => {
                    const pct = post.poll.totalVotes > 0 ? Math.round((opt.votes / post.poll.totalVotes) * 100) : 0;
                    pollHtml += `
                        <div class="relative bg-slate-50 rounded-lg overflow-hidden border border-slate-200">
                            <div class="absolute top-0 left-0 bottom-0 bg-blue-100 transition-all duration-1000" style="width: ${pct}%"></div>
                            <div class="relative p-3 flex justify-between items-center z-10">
                                <span class="font-medium text-slate-700 text-sm">${opt.text}</span>
                                <span class="text-xs font-bold text-slate-500">${pct}%</span>
                            </div>
                        </div>`;
                });
                pollHtml += `<div class="text-xs text-slate-500 mt-2 px-1">${post.poll.totalVotes} undian</div></div>`;
                extraContent = pollHtml;
            }

            // Paparan Khas Jika Jenis "Registration" (Pendaftaran)
            if (post.type === 'registration' && post.registration) {
                const posterImg = post.registration.poster || "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800&auto=format&fit=crop";
                extraContent = `
                    <div class="mt-3 mb-4 rounded-xl border border-slate-200 overflow-hidden bg-slate-50">
                        <div class="relative w-full h-48 bg-slate-100 border-b border-slate-200 flex items-center justify-center">
                            <img src="${posterImg}" alt="Poster Hebahan" class="max-h-full max-w-full object-cover" />
                        </div>
                        <div class="p-4">
                            <h4 class="font-bold text-slate-800 text-lg leading-tight mb-2">${post.registration.title}</h4>
                            <div class="flex items-center gap-3 text-sm text-slate-500 font-medium mb-3">
                                <span class="flex items-center gap-1 text-blue-600"><i data-lucide="calendar" class="w-4 h-4"></i> ${post.registration.date}</span>
                            </div>
                            <button class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-xl text-sm shadow-sm transition flex items-center justify-center gap-2">
                                Daftar Sekarang
                            </button>
                        </div>
                    </div>`;
            }

            return `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-4">
                    <div class="p-4">
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center gap-3">
                                <img src="${avatar}" class="w-10 h-10 rounded-full border border-slate-200 bg-slate-50 object-cover" />
                                <div>
                                    <h3 class="font-bold text-slate-800 text-sm">${post.author_name}</h3>
                                    <div class="flex items-center gap-2 text-xs text-slate-500">
                                        <span>${post.time}</span>
                                        <span>•</span>
                                        <span class="px-1.5 py-0.5 rounded ${tagColor}">${tagLabel}</span>
                                    </div>
                                </div>
                            </div>
                            <button class="text-slate-400 hover:bg-slate-100 p-1.5 rounded-full"><i data-lucide="more-horizontal" class="w-5 h-5"></i></button>
                        </div>
                        <p class="text-slate-700 whitespace-pre-wrap">${post.content}</p>
                        ${extraContent}
                    </div>
                    <div class="px-4 py-2 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-slate-500">
                        <button class="flex-1 flex items-center justify-center gap-2 py-2 hover:bg-slate-200 rounded-lg transition text-sm font-medium"><i data-lucide="thumbs-up" class="w-4 h-4"></i> Suka</button>
                        <button class="flex-1 flex items-center justify-center gap-2 py-2 hover:bg-slate-200 rounded-lg transition text-sm font-medium"><i data-lucide="message-square" class="w-4 h-4"></i> Komen</button>
                    </div>
                </div>
            `;
        }

        // --- 5. LOGIK FIREBASE & SIMULASI ---
        if (isFirebaseConfigured) {
            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);
            postsRef = ref(db, 'posts');

            onValue(postsRef, (snapshot) => {
                loadingSpinner.style.display = 'none';
                feedContainer.innerHTML = ''; 
                const data = snapshot.val();
                if (data) {
                    const postsArray = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();
                    postsArray.forEach(post => { feedContainer.innerHTML += createPostHTML(post); });
                } else {
                    feedContainer.innerHTML = '<div class="text-center py-10 bg-white rounded-xl border border-slate-200"><p class="text-slate-500 font-medium">Belum ada hebahan.</p></div>';
                }
                lucide.createIcons();
            });
        } else {
            // Simulasi Data Mock Lengkap
            loadingSpinner.style.display = 'none';
            let mockPosts = [
                { id: 1, author_name: "Pusat Khidmat Parlimen Sibuti", content: "Pendaftaran bagi e-Sukan peringkat Parlimen kini dibuka! Jangan lepaskan peluang untuk memenangi hadiah terkumpul RM10,000.", time: "2 jam yang lalu", tag: "sukan", type: "registration", registration: { title: "Pertandingan E-Sukan Parlimen Sibuti", date: "2 September 2026", poster: "https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=800&auto=format&fit=crop" }, avatar: "https://api.dicebear.com/7.x/shapes/svg?seed=sibuti&backgroundColor=f59e0b" },
                { id: 2, author_name: "Cikgu Salmah", content: "Pilih aktiviti kegemaran anda untuk karnival hujung tahun ini. Undian tertinggi akan mendapat peruntukan lebih besar!", time: "5 jam yang lalu", tag: "kokurikulum", type: "poll", poll: { options: [{ text: "Pertandingan Memasak", votes: 45 }, { text: "Sukaneka Air", votes: 89 }, { text: "E-Sukan (Mobile)", votes: 120 }], totalVotes: 254 }, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Salmah" }
            ];
            
            function renderMockPosts() {
                feedContainer.innerHTML = '';
                mockPosts.forEach(post => { feedContainer.innerHTML += createPostHTML(post); });
                lucide.createIcons();
            }
            renderMockPosts();

            window.addMockPost = function(newPostData) {
                mockPosts.unshift({ id: Date.now(), ...newPostData });
                renderMockPosts();
            }
        }

        // --- 6. PENGHANTARAN BORANG ---
        postForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const content = document.getElementById('post-input').value.trim();
            if (!content) return;

            submitBtn.innerHTML = 'Menyimpan...';
            submitBtn.disabled = true;

            const newPostData = {
                author_name: "Pengguna Vercel",
                content: content,
                time: "Baru sahaja",
                avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Admin",
                tag: document.getElementById('post-tag').value,
                type: window.currentComposerType // dari logik global
            };

            // Tambah data spesifik mengikut jenis tab (Poll/Registration)
            if (window.currentComposerType === 'poll') {
                newPostData.poll = {
                    totalVotes: 0,
                    options: [
                        { text: document.getElementById('poll-opt-1').value || "Pilihan 1", votes: 0 },
                        { text: document.getElementById('poll-opt-2').value || "Pilihan 2", votes: 0 }
                    ]
                };
            } else if (window.currentComposerType === 'registration') {
                newPostData.registration = {
                    title: document.getElementById('reg-title').value || "Acara Baharu",
                    date: document.getElementById('reg-date').value || "Akan Diumumkan",
                    poster: null
                };
            }

            if (isFirebaseConfigured) {
                try {
                    await set(push(postsRef), newPostData);
                } catch (error) {
                    console.error("Ralat Firebase:", error);
                    alert("Gagal menghantar hebahan.");
                }
            } else {
                window.addMockPost(newPostData);
            }

            // Reset borang
            document.getElementById('post-input').value = '';
            document.getElementById('reg-title').value = '';
            document.getElementById('reg-date').value = '';
            document.getElementById('poll-opt-1').value = '';
            document.getElementById('poll-opt-2').value = '';
            window.switchTab('normal');
            
            submitBtn.innerHTML = 'Hebahkan';
            submitBtn.disabled = false;
        });

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
